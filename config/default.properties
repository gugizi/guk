# OKEMON collector environment (config DB)
# Performance samples, sessions, and SQL text live in the repository DB.
# Every dataset below is deleted on its own retention cycle.
# support.ver is four numeric parts: major.minor.patch.build

support.lang=ko
support.title=OKEMON
support.ver=1.0.0.0
support.products=ORACLE,TIBERO,MARIADB,POSTGRESQL

collector.host=0.0.0.0
collector.port=8080
log_path=logs

# Shared secret the agent sends in X-Agent-Token
agent.token=spacemon-agent

# Default collection period (seconds). Each instance may override it.
collect.interval.sec=5

# Retention days. 0 deletes every stored row of that kind on the next purge.
retention.performance.days=14
retention.active_session.days=2
retention.session_history.days=7
retention.sql_stat.days=14
retention.sql_text.days=30
retention.event.days=30
retention.purge.interval.sec=60

threshold.cpu=80
threshold.active_sessions=40
threshold.lock_wait=1
threshold.buffer_hit=90

db.repository.path=data/okemon.sqlite
