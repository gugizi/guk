# OKEDBMON collector environment (config DB)
# The collector stores performance samples and program settings.
# Active sessions, session history, and SQL text are stored on each agent.
# support.ver is four numeric parts: major.minor.patch.build

support.lang=ko
support.title=OKEDBMON
support.ver=1.0.0.0
support.products=ORACLE,TIBERO,MARIADB,POSTGRESQL

collector.host=0.0.0.0
collector.port=8080
log_path=logs

# Shared secret the agent sends in X-Agent-Token
agent.token=okedbmon-agent

# Default collection period (seconds). Each instance may override it.
collect.interval.sec=5

# Collector retention days. Session and SQL retention is configured on each agent.
retention.performance.days=14
retention.event.days=30
retention.purge.interval.sec=60

threshold.cpu=80
threshold.active_sessions=40
threshold.lock_wait=1
threshold.buffer_hit=90

db.repository.path=data/okedbmon.sqlite
